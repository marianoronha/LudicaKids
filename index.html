<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<!-- o css coloquei externo junto com as outras páginas -->
<link rel="stylesheet" href="css/index.css">
<link rel="icon" href="midias/iconlogo.png">


<link rel="stylesheet"
href="https://use.fontawesome.com/releases/v5.8.2/css/all.css">

</head>
<body>
    <!-- Lateral esquerda de bem vindo de volta para o login-->
<div class="container">

<div class="content first-content">

<div class="first-column"> 

<img src="midias/logo.png" alt="Logo do App" class="logo-app"> 
<h2 class="title title-primary">Olá! <br>
Bem-vindo de volta.</h2>

<button id="signin" class="btn btn-primary">
Entrar
</button>

</div>
<!-- Lateral direita de criar conta  -->
<div class="second-column">

<h2 class="title title-second">Crie sua conta</h2>

<p class="description description-second">
Clique abaixo!
</p>

<!-- leva a tela de cadastro -->
<a href="cadastro.html" class="btn btn-second">Cadastrar</a>

</div>

</div>

<div class="content second-content">

<div class="first-column">

<h3 class="title title-primary">Ainda Não tem uma conta?<br>
    Cadastre-se agora e venha se divertir!</h3>


<br>
<a href="cadastro.html" class="btn btn-primary">Cadastrar</a>
<!-- os dois botões de cadastrar estão como "btn btn-primary" para mesma edição no css  -->

</div>
<!-- Quando apertou em ENTRAR na primeira pagina ele tem a aniação que leva a esta tela: -->
<div class="second-column">

<h2 class="title title-second">
Insira seu login
</h2>

<!-- opção de entrar/login -->
<form class="form" id="loginForm">

<label class="label-input">
<i class="far fa-envelope icon-modify"></i>
<input type="email" id="loginEmail" placeholder="Email " required>
</label>

<label class="label-input">
<i class="fas fa-lock icon-modify"></i>
<input type="password" id="loginPassword" placeholder="Senha" required>
</label>

<a class="password" href="#">
<u>Esqueceu sua senha?</u>
</a>

<button type="submit" class="btn btn-second">
Entrar
</button>

</form>

</div>

</div>

</div>
<!-- o JS esta externo -->
<script src="js/app.js"></script>








</body>
</html>
