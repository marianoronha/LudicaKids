<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>

    <link rel="stylesheet" href="styles/editarperfil.css">
    <link rel="stylesheet" href="styles/toast.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="midias/iconlogo.png">
</head>
<body>

    <div class="container">

        <a href="perfilresponsavel.html" class="btn-voltar">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h1>Editar Perfil</h1>
        <p class="subtitulo">Atualize suas informações</p>

        <hr>

        <h2>Dados do Responsável</h2>

        <div class="input-box bloqueado">
            <i class="fa-solid fa-user"></i>
            <input
                type="text"
                id="nomeResponsavel"
                name="nomeResponsavel"
                disabled>
                <!-- disabled impede edição. -->
        </div>

        <div class="input-box bloqueado">
            <i class="fa-solid fa-id-card"></i>
            <input
                type="text"
                id="cpfResponsavel"
                name="cpfResponsavel"
                
                disabled>
        </div>

        <div class="input-box bloqueado">
            <i class="fa-solid fa-address-card"></i>
            <input
                type="text"
                id="rgResponsavel"
                name="rgResponsavel"
                
                disabled>
        </div>

        <div class="input-box">
            <i class="fa-solid fa-envelope"></i>
            <input
                type="email"
                id="emailResponsavel"
                name="emailResponsavel"
                >
        </div>

        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input
                type="password"
                id="senhaResponsavel"
                placeholder="Nova senha"
                >
                <!-- placeholder é quando aparece um texto "fantasma" que aparece nas caixas de texto -->
        </div>

        <hr>


        <h2>Dados da Criança</h2>

        <div id="criancas-existentes"></div>

        <div class="grupo-botoes">
            <button class="btn-salvar" onclick="salvarTudo()">
                <i class="fa-solid fa-floppy-disk"></i>
                Salvar Alterações
            </button>

            <button type="button" class="btn-salvar" onclick="adicionarCriancas()">
                Adicionar Criança
            </button>
        </div>

        <div id="criancas-container"></div>

    </div>

        
    <script src="js/api.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/editarperfil.js"></script>

</body>
</html>
