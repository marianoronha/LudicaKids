<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>

    <link rel="stylesheet" href="styles/editarPerfil.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="container">

        <a href="perfilresponsavel.html" class="btn-voltar">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h1>Editar Perfil</h1>
        <p class="subtitulo">Atualize suas informações</p>

        <hr>

        <h2>Dados do Responsável</h2>
<!-- value para -->
        <div class="input-box bloqueado">
            <i class="fa-solid fa-user"></i>
            <input
                type="text"
                id="nomeResponsavel"
                name="nomeResponsavel"
                disabled>
        </div>

        <div class="input-box bloqueado">
            <i class="fa-solid fa-id-card"></i>
            <input
                type="text"
                id="cpfResponsavel"
                name="cpfResponsavel"
                
                disabled>
        </div>

        <div class="input-box bloqueado">
            <i class="fa-solid fa-address-card"></i>
            <input
                type="text"
                id="rgResponsavel"
                name="rgResponsavel"
                
                disabled>
        </div>

        <div class="input-box">
            <i class="fa-solid fa-envelope"></i>
            <input
                type="email"
                id="emailResponsavel"
                name="emailResponsavel"
                >
        </div>

        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input
                type="password"
                id="senhaResponsavel"
                name="senhaResponsavel"
                >
        </div>

        <button
            class="btn-salvar"
            onclick="salvarAlteracoes()">

            Salvar Alterações

        </button>

        <hr>

        <h2>Dados da Criança</h2>

        <div class="input-box bloqueado">
            <i class="fa-solid fa-user"></i>
            <input
            
                id="nomeCrianca"
                name="nomeCrianca"
                disabled>
        </div>

        <div class="input-box bloqueado">
            <i class="fa-solid fa-id-card"></i>
            <input
                
                id="cpfCrianca"
                name="cpfCrianca"
                disabled>
        </div>

        <div class="input-box">
            <i class="fa-solid fa-user-pen"></i>
            <input
                type="text"
                id="usuarioCrianca"
                name="usuarioCrianca">
        </div>

        <div class="input-box bloqueado">
            <i class="fa-solid fa-calendar"></i>
            <input
                type="text"
                id="dataNascimento"
                name="dataNascimento"
                
                disabled>
        </div>

        <button
            class="btn-salvar"
            onclick="salvarAlteracoes()">

            Salvar Alterações

        </button>

        <hr>

        <h2>Crianças Cadastradas</h2>

        <div id="criancasContainer"></div>

    </div>

    <script src="js/editarPerfil.js"></script>

</body>
</html>
