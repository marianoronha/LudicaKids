<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>

    <link rel="stylesheet" href="styles/editarPerfil.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="container">

        <a href="perfilresponsavel.html" class="btn-voltar">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h1>Editar Perfil</h1>
        <p class="subtitulo">Atualize suas informações</p>

        <hr>

        <h2>Dados do Responsável</h2>
<!-- value para -->
        <div class="input-box bloqueado">
            <i class="fa-solid fa-user"></i>
            <input
                type="text"
                id="nomeResponsavel"
                name="nomeResponsavel"
                value="João Silva"
                disabled>
        </div>

        <div class="input-box bloqueado">
            <i class="fa-solid fa-id-card"></i>
            <input
                type="text"
                id="cpfResponsavel"
                name="cpfResponsavel"
                value="123.456.789-00"
                disabled>
        </div>

        <div class="input-box bloqueado">
            <i class="fa-solid fa-address-card"></i>
            <input
                type="text"
                id="rgResponsavel"
                name="rgResponsavel"
                value="12.345.678-9"
                disabled>
        </div>

        <div class="input-box">
            <i class="fa-solid fa-envelope"></i>
            <input
                type="email"
                id="emailResponsavel"
                name="emailResponsavel"
                value="joao@email.com">
        </div>

        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input
                type="password"
                id="senhaResponsavel"
                name="senhaResponsavel"
                value="123456">
        </div>

        <hr>

        <h2>Dados da Criança</h2>

        <div class="input-box bloqueado">
            <i class="fa-solid fa-user"></i>
            <input
                type="text"
                id="nomeCrianca"
                name="nomeCrianca"
                value="Pedro Silva"
                disabled>
        </div>

        <div class="input-box bloqueado">
            <i class="fa-solid fa-id-card"></i>
            <input
                type="text"
                id="cpfCrianca"
                name="cpfCrianca"
                value="987.654.321-00"
                disabled>
        </div>

        <div class="input-box">
            <i class="fa-solid fa-user-pen"></i>
            <input
                type="text"
                id="usuarioCrianca"
                name="usuarioCrianca"
                value="pedrinho123">
        </div>

        <div class="input-box bloqueado">
            <i class="fa-solid fa-calendar"></i>
            <input
                type="text"
                id="dataNascimento"
                name="dataNascimento"
                value="15/03/2018"
                disabled>
        </div>

        <button
            class="btn-salvar"
            onclick="salvarAlteracoes()">

            Salvar Alterações

        </button>

        <hr>

        <h2>Crianças Cadastradas</h2>

        <div class="card-crianca">

            <div>
                <strong>Ana Silva</strong><br>
                Usuário: aninha123
            </div>

            <button
                class="btn-excluir"
                onclick="excluirCrianca(this)">

                Excluir

            </button>

        </div>

        <div class="card-crianca">

            <div>
                <strong>Carlos Silva</strong><br>
                Usuário: carlinhos
            </div>

            <button
                class="btn-excluir"
                onclick="excluirCrianca(this)">

                Excluir

            </button>

        </div>

    </div>

    <script src="js/editarPerfil.js"></script>

</body>
</html>
