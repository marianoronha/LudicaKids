<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <title>Opções de Jogos</title>

    <div class="conteudo-ludica">

                <button class="btn-jogo" onclick="window.location.href='teladragao.html'">

    <!-- JS -->
