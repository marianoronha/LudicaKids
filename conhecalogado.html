<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conheça - Lúdica Kids</title>

    <link rel="stylesheet" href="styles/conheça.css">
    <link rel="stylesheet" href="styles/menu.css">
    <link rel="stylesheet" href="styles/footer.css">
    
    <link rel="icon" href="midias/iconlogo.png">
</head>

<body>


   
    <!-- conteúdo -->

    <div class="conteudo-ludica">

        <div class="banner-inicial">
            <div class="conheca">
                <img src="midias/bubbaconheca.png" class="bubba-conheca">

                <a href="opcoesdejogoslogado.html" class="btn-conheca">
                    CONHEÇA
                </a>
            </div>
        </div>

        <!-- jogos -->
        <section class="secao-jogos">

            <div class="titulo-jogos">
                <img src="midias/conheca.png" alt="Título Conheça">
            </div>

            <div class="cards-jogos">

                <div class="card jogo1">
                    <img src="midias/cincosentidos1.png">
                    <h3>5 sentidos mágicos</h3>
                    <p>Conheça os 5 sentidos mágicos!</p>
                </div>

                <div class="card jogo2">
                    <img src="midias/respirandocomodragao2.png">
                    <h3>Respirando com o Dragão</h3>
                    <p>Ajude o amigo Dragão a se acalmar!</p>
                </div>

                <div class="card jogo3">
                    <img src="midias/identificandoemocoes3.png">
                    <h3>Identificando as emoções</h3>
                    <p>Como você está hoje? Venha descobrir!</p>
                </div>

            </div>
        </section>

        <!-- app -->
        <section class="secao-app">
            <h1>BAIXE O NOSSO APLICATIVO</h1>

            <img src="midias/logo.png" class="logo-app-conheca">

            <a href="cadastro.html" class="btn-cadastro">
                FAÇA O CADASTRO!
            </a>

        </section>

        <p class="frase">
            BRINCAR PARA ACALMAR, APRENDER PARA CRESCER!
        </p>

    </div>

<script src="js/menujogos.js"></script>
<script src="js/rodape.js"></script>
<script src="js/menu.js"></script>



</body>

</html>
